[package]
name = "liteai-config"
version.workspace = true
edition.workspace = true
description = "AI 文件分析助手 · 配置存储 / 密钥安全存储 / 模板系统"

[dependencies]
liteai-core = { path = "../liteai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
dirs = "5"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
